id: org.benjih.KPass
runtime: org.kde.Platform
runtime-version: "6.10"
sdk: org.kde.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.golang
command: kpass

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --filesystem=home

build-options:
  append-path: /usr/lib/libexec:/usr/lib/sdk/golang/bin
  env:
    GOROOT: /usr/lib/sdk/golang
    CGO_ENABLED: "1"
    CGO_LDFLAGS: -Wl,--allow-multiple-definition

modules:
  - name: kpass
    buildsystem: simple
    build-commands:
      - moc bridge/databasemanager.h -o bridge/moc_databasemanager.cpp
      - . /usr/lib/sdk/golang/enable.sh
      - go build -mod=vendor -trimpath -ldflags="-s -w" -o kpass .
      - install -Dm755 kpass ${FLATPAK_DEST}/bin/kpass
      - install -Dm644 flatpak/org.benjih.KPass.desktop ${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop
      - install -Dm644 flatpak/org.benjih.KPass.metainfo.xml ${FLATPAK_DEST}/share/metainfo/${FLATPAK_ID}.metainfo.xml
      - ffmpeg -y -loglevel error -i assets/KPass.png -vf scale=512:512 icon-512.png
      - install -Dm644 icon-512.png ${FLATPAK_DEST}/share/icons/hicolor/512x512/apps/${FLATPAK_ID}.png
      - install -Dm644 assets/KPass.png ${FLATPAK_DEST}/share/kpass/assets/KPass.png
      - cp -a qml ${FLATPAK_DEST}/share/kpass/
    sources:
      - type: dir
        path: ..
        skip:
          - .flatpak-builder
          - .devbox
          - vendor/modules.txt.bak
